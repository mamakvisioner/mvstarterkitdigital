<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starter Kit Produk Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#12211b;
    --bg-panel:#1a2f27;
    --bg-panel-2:#213a30;
    --accent:#a9e8ae;
    --accent-dim:#7fc98a;
    --text-main:#f3f7f1;
    --text-muted:#9fb5a9;
    --border:#2b4438;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg-deep);
    color:var(--text-main);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Sora',sans-serif;}

  /* ---------- App shell ---------- */
  .app{
    display:flex;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:340px;
    flex-shrink:0;
    background:var(--bg-panel);
    border-right:1px solid var(--border);
    padding:28px 20px 40px;
    height:100vh;
    overflow-y:auto;
    position:sticky;
    top:0;
  }
  .sidebar-backdrop{display:none;}
  .sidebar-close{display:none;}

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .brand-name{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.2px;}
  .brand-sub{font-size:11.5px;color:var(--text-muted);margin:2px 0 26px 44px;}

  .progress-wrap{margin-bottom:24px;}
  .progress-label{
    display:flex;justify-content:space-between;
    font-size:11.5px;color:var(--text-muted);margin-bottom:8px;
  }
  .progress-track{
    height:6px;background:var(--bg-deep);border-radius:99px;overflow:hidden;
    border:1px solid var(--border);
  }
  .progress-fill{
    height:100%;width:0%;background:var(--accent);border-radius:99px;
    transition:width .4s ease;
  }

  .module{
    margin-bottom:6px;
    border-radius:var(--radius-md);
    overflow:hidden;
  }
  .module-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 12px;
    cursor:pointer;
    border-radius:var(--radius-md);
    transition:background .15s ease;
  }
  .module-head:hover{background:var(--bg-panel-2);}
  .module.active > .module-head{background:var(--bg-panel-2);}
  .module-num{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:11px;
    color:var(--accent);
    background:rgba(169,232,174,0.12);
    border:1px solid rgba(169,232,174,0.25);
    border-radius:7px;
    padding:4px 7px;
    flex-shrink:0;
  }
  .module-title{
    font-size:13.5px;
    font-weight:600;
    line-height:1.3;
    flex:1;
  }
  .module-chevron{
    color:var(--text-muted);
    transition:transform .2s ease;
    flex-shrink:0;
  }
  .module.open .module-chevron{transform:rotate(90deg);color:var(--accent);}
  .module.done .module-num{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--bg-deep);
  }
  .module-done-tag{
    font-size:10.5px;
    font-weight:700;
    color:var(--accent);
    background:rgba(169,232,174,0.12);
    border:1px solid rgba(169,232,174,0.3);
    border-radius:99px;
    padding:2px 8px;
    flex-shrink:0;
  }

  .lesson-list{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
    padding-left:14px;
  }
  .module.open .lesson-list{max-height:900px;}
  .lesson{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:9px 12px 9px 14px;
    border-left:1px solid var(--border);
    font-size:12.8px;
    color:var(--text-muted);
    cursor:pointer;
    line-height:1.4;
    transition:color .15s ease;
  }
  .lesson:hover{color:var(--text-main);}
  .lesson.active{color:var(--accent);font-weight:600;}
  .lesson-dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--border);
    margin-top:6px;flex-shrink:0;
  }
  .lesson.active .lesson-dot{background:var(--accent);}
  .lesson.action{color:var(--accent-dim);font-style:italic;}

  /* ---------- Main content ---------- */
  .main{
    flex:1;
    padding:40px 48px 80px;
    max-width:920px;
  }
  .grid-view{display:none;}

  .eyebrow-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--accent);
    color:var(--bg-deep);
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:9px 18px;
    border-radius:99px;
    margin-bottom:28px;
  }
  .done-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(169,232,174,0.14);
    color:var(--accent);
    border:1px solid rgba(169,232,174,0.35);
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:12.5px;
    padding:8px 16px;
    border-radius:99px;
    margin-bottom:28px;
    margin-left:10px;
  }
  .hero-card{
    background:linear-gradient(155deg, var(--bg-panel) 0%, #17281f 100%);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:44px 40px;
    margin-bottom:32px;
  }
  .hero-title{
    font-size:42px;
    font-weight:800;
    color:var(--accent);
    line-height:1.08;
    letter-spacing:-0.5px;
    margin-bottom:20px;
  }
  .hero-desc{
    font-size:15.5px;
    color:#d7e3dc;
    line-height:1.65;
    max-width:60ch;
    margin-bottom:28px;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    padding:9px 15px;
    border-radius:99px;
    font-size:13px;
    font-weight:600;
    color:var(--text-main);
  }

  .section-label{
    font-family:'Sora',sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
    color:var(--text-muted);
    text-transform:uppercase;
    margin:36px 0 16px;
  }
  .topic-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .topic-card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .topic-card:hover{border-color:var(--accent-dim);transform:translateY(-1px);}
  .topic-card.done{opacity:0.55;}
  .topic-check{
    width:26px;height:26px;flex-shrink:0;
    border-radius:50%;
    border:1.5px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--accent);
    padding:6px;
    margin:-6px;
  }
  .topic-card.done .topic-check{background:var(--accent);border-color:var(--accent);color:var(--bg-deep);}
  .topic-text{font-size:13.5px;font-weight:500;line-height:1.4;flex:1;}
  .topic-card.action{border-style:dashed;}
  .topic-card.action .topic-text{color:var(--accent-dim);}
  .topic-mark-btn{
    flex-shrink:0;
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.2px;
    padding:7px 12px;
    border-radius:99px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-muted);
    cursor:pointer;
    transition:all .15s ease;
  }
  .topic-mark-btn:hover{border-color:var(--accent-dim);color:var(--accent-dim);}
  .topic-card.done .topic-mark-btn{background:var(--accent);border-color:var(--accent);color:var(--bg-deep);}

  .tool-card{
    background:linear-gradient(155deg, var(--bg-panel) 0%, #17281f 100%);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:28px 26px;
    margin-bottom:18px;
  }
  .tool-card-head{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:14px;
  }
  .tool-card-icon{
    width:44px;height:44px;flex-shrink:0;
    border-radius:12px;
    background:rgba(169,232,174,0.12);
    border:1px solid rgba(169,232,174,0.3);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
  }
  .tool-card-title{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:16px;
    margin-bottom:2px;
  }
  .tool-card-tag{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.3px;
    text-transform:uppercase;
    color:var(--accent-dim);
  }
  .tool-card-desc{
    font-size:13.5px;
    color:#d7e3dc;
    line-height:1.65;
    margin-bottom:20px;
  }
  .tool-card-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--accent);
    color:var(--bg-deep);
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:12px 22px;
    border-radius:99px;
    text-decoration:none;
    transition:opacity .15s ease;
  }
  .tool-card-link:hover{opacity:0.85;}
  .tool-card-link.pending{
    background:transparent;
    border:1.5px dashed var(--border);
    color:var(--text-muted);
    cursor:default;
    pointer-events:none;
  }
  .tool-card-note{
    font-size:11.5px;
    color:var(--text-muted);
    margin-top:10px;
  }

  .nav-buttons{
    display:flex;
    justify-content:space-between;
    margin-top:40px;
    gap:12px;
  }
  .nav-btn{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:13px 22px;
    border-radius:99px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-main);
    cursor:pointer;
    transition:all .15s ease;
  }
  .nav-btn.primary{
    background:var(--accent);
    color:var(--bg-deep);
    border-color:var(--accent);
  }
  .nav-btn:hover{border-color:var(--accent-dim);}
  .nav-btn:disabled{opacity:0.3;cursor:not-allowed;}

  /* ---------- Reading view ---------- */
  .reading-view{display:none;}
  .reading-view.open{display:block;}
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:transparent;
    border:none;
    color:var(--text-muted);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:20px;
    padding:0;
  }
  .back-btn:hover{color:var(--accent);}
  .read-status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--accent-dim);
    background:rgba(169,232,174,0.1);
    border:1px solid rgba(169,232,174,0.25);
    padding:7px 14px;
    border-radius:99px;
    margin-bottom:16px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .read-status:hover{border-color:var(--accent);}
  .read-status.done{color:var(--bg-deep);background:var(--accent);border-color:var(--accent);}
  .article-title{
    font-size:32px;
    font-weight:800;
    line-height:1.15;
    margin-bottom:24px;
    max-width:26ch;
  }
  .article-body{
    font-size:15.5px;
    line-height:1.85;
    color:#d7e3dc;
    max-width:70ch;
  }
  .article-body p{margin-bottom:18px;}
  .step-ordered-list{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:12px;}
  .step-ordered-list li{display:flex;align-items:flex-start;gap:12px;}
  .step-ordered-list .step-ordered-num{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    background:var(--bg-panel-2);color:var(--accent, #7ee2a8);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;line-height:1;
  }
  .step-ordered-list .step-ordered-text{padding-top:3px;}
  .analysis-box{
    background:rgba(232,200,119,0.1);
    border-left:3px solid #e8c877;
    border-radius:var(--radius-sm);
    padding:14px 16px;
    margin-bottom:18px;
    font-size:14.5px;
    line-height:1.75;
    color:var(--text-main);
  }
  .solution-card{
    border-radius:var(--radius-sm);
    padding:14px 16px;
    margin-bottom:12px;
    font-size:14.5px;
    line-height:1.7;
    color:var(--text-main);
    border-left:3px solid;
  }
  .solution-card .solution-title{
    display:block;
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:13.5px;
    margin-bottom:4px;
  }
  .solution-card.var-a{background:rgba(169,232,174,0.1);border-color:var(--accent);}
  .solution-card.var-a .solution-title{color:var(--accent);}
  .solution-card.var-b{background:rgba(232,200,119,0.1);border-color:#e8c877;}
  .solution-card.var-b .solution-title{color:#e8c877;}
  .solution-card.var-c{background:rgba(138,180,248,0.1);border-color:#8ab4f8;}
  .solution-card.var-c .solution-title{color:#8ab4f8;}
  .solution-card.var-d{background:rgba(240,140,140,0.1);border-color:#f08c8c;}
  .solution-card.var-d .solution-title{color:#f08c8c;}
  .solution-card.var-e{background:rgba(199,146,234,0.1);border-color:#c792ea;}
  .solution-card.var-e .solution-title{color:#c792ea;}
  .flow-card{
    background:var(--bg-panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:16px 16px 14px;
    margin-bottom:14px;
  }
  .flow-card .flow-title{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--text-main);
    margin-bottom:10px;
  }
  .flow-row{display:flex;gap:10px;margin-bottom:8px;align-items:baseline;flex-wrap:wrap;}
  .flow-row:last-child{margin-bottom:0;}
  .flow-tag{
    flex:0 0 auto;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.02em;
    text-transform:uppercase;
    padding:2px 8px;
    border-radius:99px;
    white-space:nowrap;
  }
  .flow-tag.target{background:rgba(138,180,248,0.15);color:#8ab4f8;}
  .flow-tag.masalah{background:rgba(232,200,119,0.15);color:#e8c877;}
  .flow-tag.solusi{background:rgba(169,232,174,0.15);color:var(--accent);}
  .flow-tag.produk{background:rgba(240,140,140,0.15);color:#f08c8c;}
  .flow-text{font-size:13.5px;color:var(--text-main);line-height:1.5;}
  .article-sentinel{height:1px;}

  .prompt-box{
    background:#0e1a15;
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px 18px;
    margin-bottom:18px;
    font-family:'SFMono-Regular',Consolas,'Courier New',monospace;
    font-size:12.5px;
    line-height:1.7;
    color:#d7e6da;
    white-space:pre-wrap;
    overflow-x:auto;
  }
  .prompt-box .ph{color:var(--accent);}
  .prompt-label{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .prompt-label span{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:11.5px;
    letter-spacing:0.4px;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .copy-btn{
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:700;
    padding:6px 12px;
    border-radius:99px;
    border:1px solid var(--border);
    background:var(--bg-panel);
    color:var(--text-main);
    cursor:pointer;
    transition:all .15s ease;
  }
  .copy-btn:hover{border-color:var(--accent-dim);color:var(--accent-dim);}
  .copy-btn.copied{border-color:var(--accent);color:var(--accent);}

  .module-end-banner{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:rgba(169,232,174,0.08);
    border:1px solid rgba(169,232,174,0.3);
    border-radius:var(--radius-md);
    padding:16px 18px;
    margin-top:28px;
    margin-bottom:6px;
  }
  .module-end-banner svg{color:var(--accent);flex-shrink:0;margin-top:2px;}
  .module-end-title{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--accent);
    margin-bottom:3px;
  }
  .module-end-sub{font-size:12.5px;color:var(--text-muted);line-height:1.5;}

  /* ---------- Illustrations dalam materi ---------- */
  .illus{
    background:var(--bg-panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:22px 22px 20px;
    margin-bottom:24px;
  }
  .illus-title{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:1px;
    color:var(--accent-dim);
    text-transform:uppercase;
    margin-bottom:16px;
  }
  .illus-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
  }
  .illus-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    text-align:center;
    flex:1;
    min-width:84px;
  }
  .illus-icon{
    width:44px;height:44px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(169,232,174,0.12);
    border:1px solid rgba(169,232,174,0.3);
    color:var(--accent);
    flex-shrink:0;
  }
  .illus-icon.muted{
    background:rgba(159,181,169,0.08);
    border-color:var(--border);
    color:var(--text-muted);
  }
  .illus-num{
    width:32px;height:32px;border-radius:50%;
    background:var(--accent);color:var(--bg-deep);
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif;font-weight:800;font-size:13px;
    flex-shrink:0;
  }
  .illus-label{font-size:12.5px;font-weight:600;color:var(--text-main);line-height:1.3;}
  .illus-label.muted{color:var(--text-muted);font-weight:500;}
  .illus-sub{font-size:11px;color:var(--text-muted);line-height:1.3;}
  .illus-arrow{
    color:var(--text-muted);
    flex-shrink:0;
    font-size:17px;
    padding-top:11px;
    line-height:1;
  }
  .illus-divider-vs{
    font-family:'Sora',sans-serif;
    font-weight:800;
    font-size:11.5px;
    color:var(--text-muted);
    flex-shrink:0;
    padding:12px 2px 0;
  }
  .illus-caption{
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--border);
    font-size:12.5px;
    color:var(--text-muted);
    font-style:italic;
    line-height:1.5;
  }
  .illus-formula-box{
    background:var(--bg-deep);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:18px 20px;
    font-family:'Sora',sans-serif;
    font-size:14px;
    font-weight:600;
    line-height:1.75;
    color:var(--text-main);
  }
  .illus-formula-box .blank{color:var(--accent);font-weight:700;}
  .illus-compare-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .illus-compare-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .illus-compare-card{
    background:var(--bg-deep);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:16px 16px 14px;
  }
  .illus-compare-title{
    display:flex;align-items:center;gap:8px;
    font-family:'Sora',sans-serif;font-weight:700;font-size:13px;color:var(--accent);margin-bottom:8px;
  }
  .illus-compare-desc{font-size:12px;color:var(--text-muted);line-height:1.55;}
  .illus-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .illus-chips.stacked{flex-direction:column;}

    "Satu masalah target market bisa diselesaikan dengan lebih dari satu jenis solusi. Tugas kamu adalah memilih jenis yang paling pas dengan kebiasaan dan preferensi target market kamu."
  ],
  "Contoh Target Market → Masalah → Solusi → Produk": [
    "Biar lebih jelas alurnya, ini beberapa contoh lengkap dari target market sampai jadi produk:",

    `<div class="flow-card">

    "Perhatikan bahwa setiap produk lahir langsung dari masalah spesifik, bukan dari ide random yang kelihatan keren tapi nggak nyambung ke target market."

  "Analisis Contoh Produk": [
    "Mari bedah kenapa contoh-contoh produk di atas bisa dibilang \"masuk akal untuk dijual\":",
    "Produk MPASI kuat karena masalahnya berulang setiap hari (menyusun menu), jadi solusi yang sifatnya \"siap pakai\" terasa sangat bernilai. Pembeli menghemat waktu dan tenaga yang mereka keluarkan berulang kali.",
    "Template caption jualan kuat karena masalahnya terasa setiap kali mau posting, dan bentuk template membuat pembeli bisa langsung pakai tanpa mikir dari nol. Cocok untuk orang yang waktunya terbatas karena masih kerja kantoran.",
    "Mini course kelas bahasa untuk karyawan kuat karena masalahnya adalah waktu belajar yang terbatas, dan bentuk kelas terstruktur langsung menjawab kebutuhan itu.",
    "Produk yang laku adalah yang bentuknya paling pas dengan cara target market ingin masalahnya diselesaikan, bukan sekadar bentuk yang paling gampang kamu buat."

  "Cara Memilih Produk yang Paling Masuk Akal untuk Dijual": [
    "Sebelum membuat atau membeli produk, cek 5 hal ini.",
    `<div class="solution-card var-a"><span class="solution-title">1. Ada yang membutuhkan?</span>Kalau tidak ada yang butuh, susah dijual.</div>`,
    `<div class="solution-card var-b"><span class="solution-title">2. Masalahnya jelas?</span>Semakin jelas masalahnya, semakin mudah menjelaskan produk.</div>`,
    `<div class="solution-card var-c"><span class="solution-title">3. Solusinya jelas?</span>Orang harus paham produkmu membantu apa.</div>`,
    `<div class="solution-card var-d"><span class="solution-title">4. Mudah digunakan?</span>Semakin cepat orang bisa merasakan manfaatnya, semakin bagus.</div>`,
    `<div class="solution-card var-e"><span class="solution-title">5. Mudah dijelaskan?</span>Kalau kamu perlu 20 menit untuk menjelaskan produk, mungkin positioning-nya masih terlalu rumit.</div>`
  ],
  "Buat Sendiri atau Gunakan Produk Siap Jual?": [
    "Ada dua jalur untuk punya produk digital. Kamu bisa bikin sendiri dari nol, atau menggunakan produk yang sudah jadi (seperti produk dengan hak jual kembali/PLR) yang tinggal kamu sesuaikan.",
    `<div class="solution-card var-a"><span class="solution-title">Bikin sendiri</span>Cocok kalau kamu punya pengetahuan atau pengalaman spesifik tentang masalah target market kamu, dan ingin produk yang unik serta membangun kepercayaan sebagai ahli. Butuh waktu lebih lama, tapi hasilnya lebih membedakan kamu dari kompetitor.</div>`,
    `<div class="solution-card var-b"><span class="solution-title">Produk siap jual (PLR)</span>Cocok kalau kamu ingin mulai cepat, belum yakin dengan kemampuan bikin konten dari nol, atau ingin menguji dulu apakah target market benar-benar mau beli sebelum investasi waktu besar.</div>`,
    "Nggak ada yang lebih benar di antara keduanya, pilih sesuai kondisi kamu sekarang. Yang penting, produk apapun yang kamu pilih harus tetap nyambung ke rumus target market dan masalah yang sudah kamu tentukan di bab sebelumnya."
  ],
  "Buat Judul Produk": [

  "Buat Mockup": [
    "Sebelum membeli, orang ingin tahu \"sebenarnya aku dapat apa?\" Itulah fungsi mockup, gambaran produk yang ditampilkan di halaman jualan supaya calon pembeli bisa melihat bentuknya.",
    "Nggak perlu desain yang ribet. Tampilkan saja nama produk, bentuk produknya, beberapa bagian isi, dan manfaat atau fitur utamanya.",
    `<div class="illus-chips stacked">
      <div class="illus-chip"><svg width="14" height="14"><use href="#i-doc"></use></svg> Jual printable? Tampilkan beberapa halamannya.</div>
      <div class="illus-chip"><svg width="14" height="14"><use href="#i-list"></use></svg> Jual Notion? Tampilkan tampilan dashboard-nya.</div>
      <div class="illus-chip"><svg width="14" height="14"><use href="#i-tool"></use></svg> Jual game/web app? Tampilkan screenshot saat digunakan.</div>

    `<div class="flow-card">

  "Kenapa Orang Membeli Produk?": [
    "Orang nggak membeli produk hanya karena produknya ada. Biasanya mereka punya masalah, kebutuhan, atau sesuatu yang ingin dibuat lebih mudah.",
    `<div class="analysis-box">Misalnya ibu nggak sedang mencari “Printable anak.” Yang ada di kepalanya mungkin “Anak gue bosen terus. Main apa lagi, ya?” Nah, dari situlah konten dimulai.</div>`,
    "Jadi sebelum mikir mau posting apa, coba tanya: “Orang yang butuh produkku biasanya sedang mengalami apa?”",
    "Kalau kamu sudah tahu masalahnya, jauh lebih gampang menentukan apa yang mau dibicarakan."

  "Jangan Jual Produk, Jual Solusinya": [

  "Formula Konten: Masalah → Solusi → Produk → Jualan": [

      <div class="flow-row"><span class="flow-tag solusi">Solusi</span><span class="flow-text">Coba kasih aktivitas yang nggak perlu gadget dan nggak membutuhkan banyak persiapan.</span></div>

    `<div class="analysis-box">Alur ini bisa dipakai karena kamu nggak tiba-tiba muncul dan bilang “BELI PRODUK SAYA.” Ada konteksnya. Orang diajak mengenali masalah mereka, kemudian melihat solusinya, baru dikenalkan dengan produk yang kamu jual. Jadi produknya bisa langsung masuk sebagai jalan keluar dari masalah mereka.</div>`,
    "Kalau mau bikin awareness, kamu bahkan bisa berhenti di Masalah → Solusi. Kalau mau jualan, lanjutkan ke produk dan CTA. Jadi satu ide bisa dipakai untuk beberapa jenis postingan."

  "Contoh Konten Jualan Berdasarkan Produk": [

  "Buat Konten Pertamamu": [

    "Sekarang waktunya eksekusi. Dan kamu nggak perlu duduk bengong mikirin hook atau caption dari nol, semua itu sudah dibantu lewat Content Brain.",
    "Tinggal masukkan informasi produk dan target market-mu, lalu minta Content Brain membantu menemukan ide, membuat hook, menyusun isi, sampai mengarahkan kontennya ke jualan.",
    `<ol class="step-ordered-list">

let currentModule = 0;
let currentView = "home"; // "home" | "step" | "reading"
let completed = new Set(); // keys "moduleIdx-topicIdx"
let expandedModules = new Set([0]); // modul mana saja yang daftar sub-babnya lagi terbuka di sidebar

const stepColors = [
  "#e4e1d8",
  "#dbe0e2",
  "#e8ddc9",
  "#d9e0da",
  "#e2ddd5",
  "#dde2dc"
];

function topicText(t){ return typeof t === "string" ? t : t.text; }
function isAction(t){ return typeof t !== "string" && t.action; }

function moduleProgress(mi){
  const total = modules[mi].topics.length;
  const done = modules[mi].topics.reduce((n, t, ti) => n + (completed.has(mi+'-'+ti) ? 1 : 0), 0);
  return { done, total, pct: Math.round((done/total)*100) };
}

function renderHome(){
  const grid = document.getElementById("stepGrid");
  grid.innerHTML = modules.map((m, mi) => {
    const { done, total, pct } = moduleProgress(mi);
    const badge = pct === 0 ? "Belum mulai" : pct === 100 ? "Selesai" : "Sedang berjalan";
    const btnLabel = pct === 0 ? "Mulai" : pct === 100 ? "Lihat lagi" : "Lanjutkan";
    return `
      <div class="step-card" style="background:${stepColors[mi % stepColors.length]}" onclick="openModule(${mi})">
        <span class="step-badge">${badge}</span>
        <div class="step-card-title">Step ${String(mi+1).padStart(2,'0')}: ${m.title}</div>
        <div class="step-card-desc">${m.desc}</div>
        <div class="step-stats">${total} chapter</div>
        <div class="step-progress-label"><span>Progress</span><span>${pct}%</span></div>
        <div class="step-progress-track"><div class="step-progress-fill" style="width:${pct}%"></div></div>
        <div class="step-card-footer">
          <span>Chapter: ${done}/${total}</span>
          <button class="step-go-btn" onclick="event.stopPropagation(); openModule(${mi})">${btnLabel}</button>
        </div>
      </div>
    `;
  }).join("");
}

function goHome(){
  if (readingObserver) { readingObserver.disconnect(); readingObserver = null; }
  currentView = "home";
  document.getElementById("homeView").classList.add("open");
  document.getElementById("gridView").style.display = "none";
  document.getElementById("readingView").classList.remove("open");
  renderHome();
  if (window.innerWidth <= 860) toggleSidebar(false);
}

function renderSidebar(){
  const list = document.getElementById("moduleList");
  list.innerHTML = "";
  modules.forEach((m, mi) => {
    const div = document.createElement("div");
    const { pct: mPct } = moduleProgress(mi);
    const moduleDone = mPct === 100;
    div.className = "module" + (expandedModules.has(mi) ? " open" : "") + (mi === currentModule ? " active" : "") + (moduleDone ? " done" : "");
    div.innerHTML = `
      <div class="module-head" onclick="toggleModuleExpand(${mi})">
        <span class="module-num">${moduleDone ? '✓' : String(mi+1).padStart(2,'0')}</span>
        <span class="module-title">${m.title}</span>
        ${moduleDone ? '<span class="module-done-tag">Selesai</span>' : ''}
        <span class="module-chevron">›</span>
      </div>
      <div class="lesson-list">
        ${m.topics.map((t, ti) => `
          <div class="lesson ${isAction(t) ? 'action' : ''} ${completed.has(mi+'-'+ti) ? 'active' : ''}" onclick="event.stopPropagation(); openTopic(${mi}, ${ti})">
            <span class="lesson-dot"></span><span>${topicText(t)}</span>
          </div>
        `).join("")}
      </div>
    `;
    list.appendChild(div);
  });
  updateProgress();
}

function toggleModuleExpand(mi){
  if (expandedModules.has(mi)) expandedModules.delete(mi);
  else expandedModules.add(mi);
  renderSidebar();
}

function renderMain(){
  const m = modules[currentModule];
  document.getElementById("moduleEyebrow").textContent = `Step ${String(currentModule+1).padStart(2,'0')}`;
  document.getElementById("moduleTitle").textContent = m.title;
  document.getElementById("moduleDesc").textContent = m.desc;
  const { pct: modulePct } = moduleProgress(currentModule);
  document.getElementById("moduleDonePill").style.display = modulePct === 100 ? "inline-flex" : "none";

  const grid = document.getElementById("topicGrid");
  grid.innerHTML = m.topics.map((t, ti) => {
    const done = completed.has(currentModule+'-'+ti);
    return `
      <div class="topic-card ${isAction(t) ? 'action' : ''} ${done ? 'done' : ''}" onclick="openTopic(${currentModule}, ${ti})">
        <div class="topic-check" onclick="event.stopPropagation(); toggleTopic(${currentModule}, ${ti})">${done ? '✓' : ''}</div>
        <div class="topic-text">${topicText(t)}</div>
        <button class="topic-mark-btn" onclick="event.stopPropagation(); toggleTopic(${currentModule}, ${ti})">${done ? '✓ Selesai' : 'Tandai selesai'}</button>
      </div>
    `;
  }).join("");

  document.getElementById("prevBtn").disabled = currentModule === 0;
  document.getElementById("nextBtn").textContent = currentModule === modules.length - 1 ? "Selesai" : "Step selanjutnya →";
  document.getElementById("nextBtn").disabled = currentModule === modules.length - 1;
}

function toggleTopic(mi, ti){
  const key = mi+'-'+ti;
  if (completed.has(key)) completed.delete(key); else completed.add(key);
  renderSidebar();
  renderMain();
  if (readingObserver) syncReadStatus(mi, ti);
}

function selectModule(mi){
  if (readingTopic) closeReading();
  currentModule = mi;
  currentView = "step";
  document.getElementById("homeView").classList.remove("open");
  document.getElementById("readingView").classList.remove("open");
  document.getElementById("gridView").style.display = "";
  renderSidebar();
  renderMain();
  if (window.innerWidth <= 860) toggleSidebar(false);
}

function resumeTopicIndex(mi){
  const topics = modules[mi].topics;
  for (let ti = 0; ti < topics.length; ti++){
    if (!completed.has(mi+'-'+ti)) return ti;
  }
  return topics.length - 1;
}

function openModule(mi){
  selectModule(mi);
  openTopic(mi, resumeTopicIndex(mi));
}

function goModule(dir){
  const next = currentModule + dir;
  if (next < 0 || next >= modules.length) return;
  openModule(next);
}

function updateProgress(){
  const total = modules.reduce((sum, m) => sum + m.topics.length, 0);
  const done = completed.size;
  document.getElementById("progressText").textContent = `${done} / ${total} chapter`;
  document.getElementById("progressPercent").textContent = `${Math.round((done/total)*100)}%`;
  document.getElementById("progressFill").style.width = `${(done/total)*100}%`;
}

function toggleSidebar(force){
  const sb = document.getElementById("sidebar");
  const backdrop = document.getElementById("sidebarBackdrop");
  const willOpen = force === false ? false : !sb.classList.contains("open");
  sb.classList.toggle("open", willOpen);
  backdrop.classList.toggle("show", willOpen);
  document.body.style.overflow = willOpen ? "hidden" : "";
}

/* ---------- Reading view: buka materi, auto-checklist saat scroll sampai bawah ---------- */
let readingTopic = null; // {mi, ti}
let readingObserver = null;

function placeholderBody(title){
  // Placeholder isi materi, dipakai untuk topik yang belum ada konten aslinya di topicContent.
  return [
    `Ini adalah placeholder untuk materi "${title}". Konten asli akan ditulis di bagian ini nanti.`,
    "Paragraf ini sengaja dibuat cukup panjang supaya kamu bisa lihat bagaimana halaman baca bekerja: kamu scroll dari atas sampai bawah, dan begitu sampai di ujung materi, kotak checklist di daftar materi akan otomatis tercentang tanpa perlu klik manual.",
    "Kamu tetap bisa menandai materi selesai secara manual kapan saja lewat lingkaran centang di kartu materi, tanpa harus membaca sampai habis.",
    "Ketika konten asli sudah siap, tinggal ganti isi placeholder ini dengan teks, gambar, atau video sebenarnya. Struktur halaman dan mekanisme checklist otomatis tetap akan berjalan sama seperti sekarang.",
    "Sampai di sini, kamu sudah membaca sampai akhir materi ini."
  ].map(p => `<p>${p}</p>`).join("");
}

function articleBodyFor(title){
  const illus = topicIllustration[title] || "";
  const paragraphs = topicContent[title];
  if(paragraphs){
    return illus + paragraphs.map(p => p.trim().startsWith("<") ? p : `<p>${p}</p>`).join("");
  }
  return illus + placeholderBody(title);
}

function openTopic(mi, ti){
  readingTopic = { mi, ti };
  currentModule = mi;
  currentView = "reading";
  expandedModules.add(mi);
  const t = modules[mi].topics[ti];
  const title = topicText(t);

  document.getElementById("articleTitle").textContent = title;
  document.getElementById("articleBody").innerHTML = articleBodyFor(title);
  document.getElementById("homeView").classList.remove("open");
  document.getElementById("gridView").style.display = "none";
  document.getElementById("readingView").classList.add("open");
  renderSidebar();

  document.getElementById("readPrevBtn").disabled = (mi === 0 && ti === 0);
  const isLastTopicInModule = ti === modules[mi].topics.length - 1;
  const isLast = mi === modules.length - 1 && isLastTopicInModule;
  const hasNextModule = isLastTopicInModule && mi < modules.length - 1;
  document.getElementById("readNextBtn").disabled = isLast;
  document.getElementById("readNextBtn").textContent = isLast
    ? "Materi terakhir"
    : hasNextModule
      ? `Lanjut ke Step ${String(mi+2).padStart(2,'0')} →`
      : "Materi selanjutnya →";

  const banner = document.getElementById("moduleEndBanner");
  if (isLastTopicInModule) {
    banner.style.display = "flex";
    document.getElementById("moduleEndTitle").textContent = `Akhir Step ${String(mi+1).padStart(2,'0')}: ${modules[mi].title}`;
    document.getElementById("moduleEndSub").textContent = isLast
      ? "Kamu sudah menyelesaikan seluruh Starter Kit ini."
      : `Lanjut ke Step ${String(mi+2).padStart(2,'0')}: ${modules[mi+1].title}.`;
  } else {
    banner.style.display = "none";
  }

  syncReadStatus(mi, ti);
  window.scrollTo({ top: 0, behavior: "instant" });

  if (readingObserver) readingObserver.disconnect();
  const sentinel = document.getElementById("articleSentinel");
  readingObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const key = mi+'-'+ti;
        if (!completed.has(key)) {
          completed.add(key);
          renderSidebar();
          syncReadStatus(mi, ti);
        }
      }
    });
  }, { threshold: 1.0 });
  readingObserver.observe(sentinel);
}

function syncReadStatus(mi, ti){
  const done = completed.has(mi+'-'+ti);
  const badge = document.getElementById("readStatus");
  badge.textContent = done ? "✓ Sudah selesai" : "Tandai selesai";
  badge.classList.toggle("done", done);
}

function toggleCurrentReadingTopic(){
  if (!readingTopic) return;
  const { mi, ti } = readingTopic;
  toggleTopic(mi, ti);
}

function copyPromptBox(btn){
  const box = btn.closest(".prompt-label").nextElementSibling;
  const text = box.innerText;
  navigator.clipboard.writeText(text).then(() => {
    const original = btn.textContent;
    btn.textContent = "Disalin ✓";
    btn.classList.add("copied");
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove("copied");
    }, 1500);
  });
}

function closeReading(){
  if (readingObserver) { readingObserver.disconnect(); readingObserver = null; }
  document.getElementById("readingView").classList.remove("open");
  document.getElementById("gridView").style.display = "";
  readingTopic = null;
}

function stepTopic(dir){
  if (!readingTopic) return;
  let { mi, ti } = readingTopic;
  ti += dir;
  if (ti < 0) { mi -= 1; if (mi < 0) return; ti = modules[mi].topics.length - 1; }
  if (ti >= modules[mi].topics.length) { mi += 1; if (mi >= modules.length) return; ti = 0; }
  currentModule = mi;
  openTopic(mi, ti);
}

renderSidebar();
renderMain();
goHome();
</script>
